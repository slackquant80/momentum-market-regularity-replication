name: T20 replication v1.0.2 original 202609 source-to-result release QA (one run)

on:
  push:
    branches:
      - review/t20-century-longcash-v102-20261116
    paths:
      - .github/workflows/t20-v102-scientific-replay-once.yml

permissions:
  contents: read

jobs:
  independent-public-source-replay:
    if: github.repository == 'slackquant80/momentum-market-regularity-replication'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin documented historical research Python 3.13.5 (not runner default Python 3.14)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Install only locked reproduction dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Test all retained earlier public exhibits and new synthetic trading contract
        run: |
          set -euo pipefail
          python scripts/run_release_smoke.py
          python tests/test_t20_absolute_momentum_contract.py
      - name: Fetch exact 202609 author-original French CSV into transient CI folder
        run: |
          set -euo pipefail
          mkdir -p .t20_original_provider_transient
          curl --fail --silent --show-error --location --max-time 60 --retry 2 \
           'https://raw.githubusercontent.com/ditullio33/smelly.muffins/639538aee9b67f295f1ee6a4b2113574f9db2c87/data/F-F_Research_Data_Factors.csv' \
           -o .t20_original_provider_transient/FF3_202609.csv
          echo 'a3894d74d553cab812eabbe706bdbf443c97eb20b24b05e3e5f3ce47e46b90bb  .t20_original_provider_transient/FF3_202609.csv' | sha256sum --check --status
          echo 'FRENCH_202609_ARCHIVED_ORIGINAL_BYTES_MATCH_RETAINED_PROVENANCE'
      - name: End-to-end original-source return math and Figure 7 reconstruction
        run: |
          set -euo pipefail
          mkdir -p .t20_replay_qa
          SRC=.t20_original_provider_transient/FF3_202609.csv
          python scripts/t20_absolute_momentum_longrun.py --csv "$SRC" --output .t20_replay_qa/full.json
          python scripts/t20_absolute_momentum_hac_crisis_robustness.py --csv "$SRC" --output .t20_replay_qa/hac.json
          python scripts/t20_absolute_momentum_figure_candidate.py --csv "$SRC" --svg .t20_replay_qa/fig07.svg
          cmp .t20_replay_qa/fig07.svg exhibits/t20_fig07_absolute_momentum_1927_202609.svg
          python - <<'PY'
          from pathlib import Path
          import json,math
          checks=[
            ('.t20_replay_qa/full.json','provenance/t20_absolute_momentum_202609_source_locked_results.json',
             ('full_sample','calendar_partitions','crisis_windows','rolling_10y','original_source')),
            ('.t20_replay_qa/hac.json','provenance/t20_absolute_momentum_202609_hac_crisis_results.json',
             ('sample_windows','retrospective_crisis_case_panel','source_sha256'))]
          def close(a,b,key):
              if isinstance(a,dict):
                  assert isinstance(b,dict)
                  for k,v in a.items():
                      assert k in b,(key,k)
                      close(v,b[k],key+'.'+str(k))
              elif isinstance(a,list):
                  assert isinstance(b,list) and len(a)==len(b)
                  for i,(v,w) in enumerate(zip(a,b)):close(v,w,key+f'[{i}]')
              elif isinstance(a,(int,float)) and not isinstance(a,bool):
                  assert isinstance(b,(int,float)) and math.isclose(a,b,rel_tol=1e-10,abs_tol=1e-10),(key,a,b)
              else:assert a==b,(key,a,b)
          for live,reference,fields in checks:
              a=json.loads(Path(live).read_text())
              b=json.loads(Path(reference).read_text())
              for field in fields:close(a[field],b[field],field)
          a=json.loads(Path('.t20_replay_qa/full.json').read_text())
          assert a['full_sample']['abs12_10bp']['months']==1191
          assert a['full_sample']['abs12_10bp']['longest_underwater_months']==95
          assert a['full_sample']['market_10bp']['longest_underwater_months']==184
          print('T20_v1.0.2_FROZEN_202609_SOURCE_TO_SCIENTIFIC_RETURN_PATHS_AND_FIG7_EXACT_REPLAY_PASS')
          PY
          rm -rf .t20_original_provider_transient .t20_replay_qa
      - name: Verify no third-party source CSV has been added to public git
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -iname 'F-F_Research_Data_Factors*.csv' -o -iname '*aqr*raw*.csv' \) -not -path './.git/*' -print -quit)"
          echo 'T20_PUBLIC_202609_PROVIDER_RAW_DATA_NOT_REDISTRIBUTED'
