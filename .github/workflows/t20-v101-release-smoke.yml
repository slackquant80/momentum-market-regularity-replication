name: T20 v1.0.1 bounded replication release smoke (one-time)

on:
  push:
    branches:
      - review/figure6-contiguous-ssrn-revision-v101-20261115
    paths:
      - .github/workflows/t20-v101-release-smoke.yml

permissions:
  contents: read

jobs:
  verify-source-and-exhibits:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned test dependencies only
        run: python -m pip install -r requirements.txt
      - name: Offline release smoke and exact exhibit diagnostics
        run: |
          set -euo pipefail
          python scripts/run_release_smoke.py
          python scripts/t20_fig6_contiguous_official_replay_render.py
          python scripts/verify_exhibit_labels.py
          git diff --exit-code -- exhibits/t20_fig06_industry_contiguous_1927_202609_VERIFIED.svg
          test "$(git hash-object exhibits/t20_fig06_industry_contiguous_1927_202609_VERIFIED.svg)" = '9b9ac0a6dd90534f509f88f26a7db2e92d540f17'
          python - <<'PY'
          from pathlib import Path
          import json
          src=Path('CITATION.cff').read_text()
          assert 'version: "v1.0.1"' in src
          assert 'doi: 10.5281/zenodo.24047812' not in src, 'Do not cite a v1.0.0 version DOI for v1.0.1'
          ref=json.loads(Path('provenance/expected_replay.json').read_text())
          rows=ref['figure6_202609']['selected_periods']
          assert len(rows)==5 and sum(row[1] for row in rows)==1191
          assert rows[-1][0]=='2020–Sep 2026' and rows[-1][1]==81
          assert abs(rows[-1][2]-0.76893)<1e-9
          nested=ref['figure6_202609']['nested_short_window']
          assert nested['n']==33 and abs(nested['mean_spread_month_pp']+0.079495)<1e-9
          print('T20_V101_OFFLINE_RELEASE_SCIENTIFIC_EXHIBIT_QA_PASS')
          PY
      - name: Record exact tested commit and bounds
        if: always()
        run: |
          echo "TESTED_COMMIT=${GITHUB_SHA}"
          echo "TEST_SCOPE=offline_synthetic_labels_source_locked_render_no_new_provider_download"
