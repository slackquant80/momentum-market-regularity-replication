name: T20 v1.0.3 exact-tag Zenodo software ZIP (one time)
on:
  push:
    branches:
      - release/t20-zenodo-v103-bundle-20261116
    paths:
      - .github/workflows/t20-zenodo-v103-archive-once.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout immutable v1.0.3 release tag
        uses: actions/checkout@v4
        with:
          ref: 4766f1d13deee38f763caa475daaf993c286d0a1
          persist-credentials: false
      - name: Build and verify exact-tag source-only Zenodo deposit ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4766f1d13deee38f763caa475daaf993c286d0a1
          # Exact SHA checkout is authoritative; shallow checkout need not fetch tag refs.
          mkdir -p dist
          ZIP=dist/momentum-market-regularity-replication-v1.0.3.zip
          git archive --format=zip --prefix=momentum-market-regularity-replication-v1.0.3/ HEAD > "$ZIP"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          z=Path('dist/momentum-market-regularity-replication-v1.0.3.zip')
          with zipfile.ZipFile(z) as arc:
              names=arc.namelist()
              pref='momentum-market-regularity-replication-v1.0.3/'
              for required in ['README.md','CITATION.cff','LICENSE','requirements.txt','exhibits/LICENSE.md','scripts/run_release_smoke.py','scripts/t20_absolute_momentum_longrun.py','tests/test_t20_absolute_momentum_contract.py','provenance/pinned_inputs.json','exhibits/t20_fig07_absolute_momentum_1927_202609.svg']:
                  assert pref+required in names,required
              assert all(not (n.lower().endswith(('.csv','.xlsx','.xls','.env')) or '/.git/' in n) for n in names)
              assert b'version: "v1.0.3"' in arc.read(pref+'CITATION.cff')
          receipt={'status':'EXACT_IMMUTABLE_GITHUB_TAG_ARCHIVE_PASS','tag':'v1.0.3','tag_commit':'4766f1d13deee38f763caa475daaf993c286d0a1','source_zip':z.name,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'bytes':z.stat().st_size,'source_files':len(names),'raw_third_party_data_included':False,'version_specific_zenodo_doi':'NOT_ASSIGNED_BY_THIS_GITHUB_WORKFLOW'}
          Path('dist/ARCHIVE_SHA256_AND_SOURCE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Attach verified ZIP and checksum for author deposit
        uses: actions/upload-artifact@v4
        with:
          name: t20-zenodo-v103-exact-tag-source
          path: dist/*
          retention-days: 7
          if-no-files-found: error
