name: T20 v1.0.2 verified GitHub release (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/t20-publish-v102-once.yml

permissions:
  contents: write

jobs:
  publish-exact-source:
    if: github.repository == 'slackquant80/momentum-market-regularity-replication'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED: 1b42bbb147f38d89ea6287fe623ec981b1aac280
      TAG: v1.0.2
    steps:
      - name: Checkout public main with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact source and lack of existing release
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$APPROVED^{commit}"
          git show "$APPROVED:CITATION.cff" | grep -Fx 'version: "v1.0.2"'
          git show "$APPROVED:CITATION.cff" | grep -Fx 'date-released: 2026-11-16'
          git show "$APPROVED:provenance/t20_absolute_momentum_202609_source_locked_results.json" | grep -F 'a3894d74d553cab812eabbe706bdbf443c97eb20b24b05e3e5f3ce47e46b90bb'
          git show "$APPROVED:exhibits/t20_fig07_absolute_momentum_1927_202609.svg" | grep -F 'Underwater drawdown from preceding high'
          git cat-file -e refs/tags/v1.0.0
          git cat-file -e refs/tags/v1.0.1
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to overwrite existing tag $TAG."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to duplicate existing release $TAG."
            exit 1
          fi
          echo T20_V102_SOURCE_AND_CUSTODY_PASS
      - name: Create immutable release at source-tested commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/T20_v102_notes.md <<'EOF'
          Source-verified software for Momentum as a Market Regularity, including the July 1927 to September 2026 long-only historical U.S. research-market-to-Treasury-bills absolute-momentum experiment and original Figure 7.

          - Exact source commit: 1b42bbb147f38d89ea6287fe623ec981b1aac280.
          - Original French September 2026 monthly factor vintage: CSV SHA-256 a3894d74d553cab812eabbe706bdbf443c97eb20b24b05e3e5f3ce47e46b90bb. Third-party source rows are not redistributed.
          - 1,191 evaluation months, lagged 12-month own-return rule, actual historical monthly RF, 10bp illustrative switch cost, passive and ex-post exposure-matched alternatives, adverse regimes and execution-delay sensitivity.
          - Replayed original source through all new outputs and Figure 7 in GitHub Actions run 43789300321 (PASS). Synthetic checks and source receipts are included.
          - Research-market proxy is not an executable ETF account. It does not demonstrate investor behavior or guaranteed future protection.
          - Prior GitHub releases v1.0.0 and v1.0.1 remain unchanged. SSRN abstract 7707479 is separately maintained.
          - New Zenodo v1.0.2 version DOI is not yet established. Preserve all-versions concept DOI 10.5281/zenodo.24047811 and original v1.0.0 fixed DOI 10.5281/zenodo.24047812.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$APPROVED" \
            --title "T20 Replication v1.0.2 — Century Absolute Momentum and Figure 7" \
            --notes-file /tmp/T20_v102_notes.md --latest
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$APPROVED"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish \
            --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,target:.targetCommitish}'
          echo T20_v1.0.2_EXACT_SOURCE_RELEASE_PASS
